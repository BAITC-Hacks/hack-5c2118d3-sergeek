services:
  hackathon:
    build:
      context: "./beeline_case_participants (1)"
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - "./beeline_case_participants (1):/app"
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    working_dir: /workspace
    volumes:
      - ".:/workspace"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"
