services:
  hackathon:
    build:
      context: "./beeline_case_participants (1)"
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - "./beeline_case_participants (1):/app"
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    working_dir: /workspace
    volumes:
      - ".:/workspace"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
